<!DOCTYPE html>
<html>
<head>
    <title>Criar Produto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f5f5f5; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        h1 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #4CAF50; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #4CAF50; color: white; width: 100%; }
        .btn-primary:hover { background: #45a049; }
        .btn-cancel { background: #999; color: white; display: inline-block; margin-top: 10px; text-decoration: none; text-align: center; }
        .btn-cancel:hover { background: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Criar Produto</h1>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Nome:</label>
                <input type="text" name="nome" required>
            </div>
            
            <div class="form-group">
                <label>Preço:</label>
                <input type="number" name="preco" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label>Estoque:</label>
                <input type="number" name="estoque" required>
            </div>
            
            <div class="form-group">
                <label>Categoria:</label>
                <select name="categoria" required>
                    <option value="">-- Selecione --</option>
                    {% for cat in categorias %}
                    <option value="{{ cat.id }}">{{ cat.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
        
        <a href="{% url 'listar_produtos' %}" class="btn btn-cancel">Cancelar</a>
    </div>
</body>
</html>
