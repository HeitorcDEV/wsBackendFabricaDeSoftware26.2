<!DOCTYPE html>
<html>
<head>
    <title>Deletar Produto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f5f5f5; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        h1 { margin-bottom: 20px; color: #333; }
        .alert { background: #ffebee; padding: 15px; border-left: 4px solid #f44336; margin-bottom: 20px; }
        .alert p { color: #c62828; }
        .actions { display: flex; gap: 10px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; flex: 1; }
        .btn-danger { background: #f44336; color: white; }
        .btn-danger:hover { background: #da190b; }
        .btn-cancel { background: #999; color: white; text-decoration: none; text-align: center; }
        .btn-cancel:hover { background: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Deletar Produto</h1>
        
        <div class="alert">
            <p><strong>Tem certeza?</strong></p>
            <p>Você está prestes a deletar: <strong>{{ produto.nome }}</strong></p>
            <p>Esta ação é irreversível!</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            <div class="actions">
                <button type="submit" class="btn btn-danger">Deletar</button>
                <a href="{% url 'listar_produtos' %}" class="btn btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
